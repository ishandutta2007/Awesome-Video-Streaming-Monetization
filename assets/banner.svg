<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.7" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes streamPulse {
        0%, 100% { height: 18px; y: 151px; }
        50% { height: 42px; y: 139px; }
      }
      @keyframes streamPulse2 {
        0%, 100% { height: 35px; y: 142px; }
        50% { height: 14px; y: 153px; }
      }
      @keyframes streamPulse3 {
        0%, 100% { height: 26px; y: 147px; }
        50% { height: 50px; y: 135px; }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes flowOrbit {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 60; }
      }
      .anim-glow {
        transform-origin: 300px 180px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .anim-glow-right {
        transform-origin: 900px 150px;
        animation: pulseGlow 9s ease-in-out infinite reverse;
      }
      .anim-float {
        animation: floatSoft 4.5s ease-in-out infinite;
      }
      .anim-float-delayed {
        animation: floatSoft 5.5s ease-in-out infinite 1.5s;
      }
      .wave-bar-1 { animation: streamPulse 1.8s ease-in-out infinite; }
      .wave-bar-2 { animation: streamPulse2 2.2s ease-in-out infinite; }
      .wave-bar-3 { animation: streamPulse3 1.5s ease-in-out infinite; }
      .wave-bar-4 { animation: streamPulse 2.4s ease-in-out infinite 0.4s; }
      .wave-bar-5 { animation: streamPulse2 1.7s ease-in-out infinite 0.2s; }
      .live-dot { animation: blinkDot 1.4s ease-in-out infinite; }
      .flow-line {
        stroke-dasharray: 6 10;
        animation: flowOrbit 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5" />

  <!-- Background Ambient Glows (Underneath Everything) -->
  <circle class="anim-glow" cx="240" cy="180" r="160" fill="url(#accentGlow)" filter="url(#glowFilter)" />
  <circle class="anim-glow-right" cx="960" cy="160" r="180" fill="url(#accentGlow)" filter="url(#glowFilter)" />

  <!-- Subtle Animated Flow Lines in Background -->
  <g opacity="0.35">
    <path class="flow-line" d="M 50 180 Q 300 80 600 180 T 1150 180" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="flow-line" d="M 50 220 Q 300 320 600 220 T 1150 220" fill="none" stroke="#818cf8" stroke-width="1.5" />
  </g>

  <!-- Animated Sound/Bitrate Stream Visualizer (Far Right Ambient) -->
  <g opacity="0.45" transform="translate(980, 50)">
    <rect class="wave-bar-1" x="0" y="151" width="4" height="18" rx="2" fill="#38bdf8" />
    <rect class="wave-bar-2" x="8" y="142" width="4" height="35" rx="2" fill="#818cf8" />
    <rect class="wave-bar-3" x="16" y="147" width="4" height="26" rx="2" fill="#c084fc" />
    <rect class="wave-bar-4" x="24" y="151" width="4" height="18" rx="2" fill="#38bdf8" />
    <rect class="wave-bar-5" x="32" y="142" width="4" height="35" rx="2" fill="#a855f7" />
    <rect class="wave-bar-1" x="40" y="151" width="4" height="18" rx="2" fill="#38bdf8" />
    <rect class="wave-bar-3" x="48" y="147" width="4" height="26" rx="2" fill="#818cf8" />
    <rect class="wave-bar-2" x="56" y="142" width="4" height="35" rx="2" fill="#38bdf8" />
  </g>

  <!-- Foreground Content: Fully Layered on Top -->

  <!-- Live Ecosystem Chip -->
  <g transform="translate(60, 48)">
    <rect width="190" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle class="live-dot" cx="18" cy="15" r="4.5" fill="#ef4444" />
    <text x="32" y="20" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">BROADCAST &amp; MONETIZATION</text>
  </g>

  <!-- Main Headline Title (Foreground) -->
  <text x="60" y="132" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
    Awesome Video Streaming &amp; Monetization
  </text>

  <!-- Subtitle (Foreground, Crisp High-Contrast) -->
  <text x="60" y="174" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
    Curated SaaS Platforms &amp; Open-Source Infrastructure for Ad Stitching (SSAI), Pay-Per-View &amp; OTT Frontends
  </text>

  <!-- Interactive Feature Badges / Capability Highlights -->
  <g transform="translate(60, 222)">
    <!-- Badge 1: SSAI & Ad Insertion -->
    <g class="anim-float">
      <rect width="240" height="58" rx="12" fill="url(#chipGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="28" cy="29" r="14" fill="#0284c7" fill-opacity="0.25" />
      <text x="22" y="34" font-size="14">📺</text>
      <text x="52" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">SSAI &amp; Ad Stitching</text>
      <text x="52" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">VAST, VMAP, SGAI &amp; Ad Triggers</text>
    </g>

    <!-- Badge 2: Paywalls & PPV -->
    <g class="anim-float-delayed" transform="translate(258, 0)">
      <rect width="250" height="58" rx="12" fill="url(#chipGrad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="28" cy="29" r="14" fill="#4f46e5" fill-opacity="0.25" />
      <text x="22" y="34" font-size="14">💳</text>
      <text x="52" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Pay-Per-View &amp; SVOD</text>
      <text x="52" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Encrypted Sessions &amp; Gating</text>
    </g>

    <!-- Badge 3: OTT Frontends & Players -->
    <g class="anim-float" transform="translate(526, 0)">
      <rect width="250" height="58" rx="12" fill="url(#chipGrad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="28" cy="29" r="14" fill="#9333ea" fill-opacity="0.25" />
      <text x="22" y="34" font-size="14">⚡</text>
      <text x="52" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">OTT Frontends &amp; Players</text>
      <text x="52" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Multi-Screen HLS, DASH &amp; WebRTC</text>
    </g>

    <!-- Badge 4: Self-Hosted Control -->
    <g class="anim-float-delayed" transform="translate(794, 0)">
      <rect width="250" height="58" rx="12" fill="url(#chipGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="28" cy="29" r="14" fill="#059669" fill-opacity="0.25" />
      <text x="22" y="34" font-size="14">🛡️</text>
      <text x="52" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Open-Source Freedom</text>
      <text x="52" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Self-Hosted Without Vendor Lock-In</text>
    </g>
  </g>

  <!-- Bottom Spec Bar -->
  <g transform="translate(60, 316)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
      MODELS: AVOD · SVOD · TVOD · FAST · LIVE COMMERCE · REVERSE PROXIES · DRM &amp; WATERMARKING
    </text>
  </g>
</svg>
